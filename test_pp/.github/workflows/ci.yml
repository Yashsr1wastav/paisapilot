name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web-and-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Require committed root lockfile
        shell: bash
        run: test -f package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run backend and shared tests
        run: npm test
      - name: Typecheck backend and shared code
        run: npm run typecheck:backend
      - name: Typecheck web
        run: npm run typecheck:web
      - name: Build web
        run: npm run web:build

  mobile:
    if: hashFiles('mobile/package-lock.json') != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: Check mobile app
        run: npm run check